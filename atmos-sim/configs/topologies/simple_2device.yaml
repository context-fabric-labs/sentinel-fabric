# Simple OEM topology: 1 RC, 1 Switch, 2 ATMOS E3.S devices
# Shared x8 uplink — demonstrates uplink contention
name: simple_2device
description: >
  Minimal topology with 2 ATMOS devices behind a single PCIe switch.
  Both devices share an x8 uplink to the root complex.

root_complex:
  name: CPU0_RC0
  aggregate_bandwidth_bytes_sec: 64000000000   # 64 GB/s
  max_endpoints: 16
  host_memory_bandwidth_bytes_sec: 100000000000 # 100 GB/s

switch:
  name: PCIe_Switch_A
  port_count: 8
  ingress_queue_depth: 32
  switch_latency_ns: 200

uplink:
  generation: 4
  lane_count: 8
  latency_ns: 150

devices:
  - name: ATMOS_E3S_0
    index: 0
    link:
      generation: 4
      lane_count: 8
      latency_ns: 100
    module:
      name: Module_0
      npu:
        peak_flops: 500000000000     # 500 GFLOPS
        tensor_engine_count: 4
        vector_engine_count: 4
        execution_slots: 8
        local_sram_bytes: 268435456  # 256 MB
        command_queue_depth: 64
      hbf:
        channel_count: 8
        capacity_bytes: 137438953472 # 128 GB
        bandwidth_per_channel_bytes_sec: 14000000000 # 14 GB/s
        max_outstanding: 64
        protocol_overhead_ns: 500
      lpddr:
        channel_count: 4
        capacity_bytes: 34359738368  # 32 GB
        bandwidth_per_channel_bytes_sec: 6000000000  # 6 GB/s
        max_outstanding: 32
        read_write_turnaround_ns: 15
      dma:
        descriptor_queue_depth: 64
        max_outstanding: 16
        channel_count: 2
        setup_overhead_ns: 200
        bandwidth_bytes_sec: 32000000000 # 32 GB/s
      dma_engine_count: 2
      pcie:
        generation: 4
        lane_count: 8
        max_outstanding: 32
        credit_limit: 256

  - name: ATMOS_E3S_1
    index: 1
    link:
      generation: 4
      lane_count: 8
      latency_ns: 100
    module:
      name: Module_1
      npu:
        peak_flops: 500000000000
        tensor_engine_count: 4
        vector_engine_count: 4
        execution_slots: 8
        local_sram_bytes: 268435456
        command_queue_depth: 64
      hbf:
        channel_count: 8
        capacity_bytes: 137438953472
        bandwidth_per_channel_bytes_sec: 14000000000
        max_outstanding: 64
        protocol_overhead_ns: 500
      lpddr:
        channel_count: 4
        capacity_bytes: 34359738368
        bandwidth_per_channel_bytes_sec: 6000000000
        max_outstanding: 32
        read_write_turnaround_ns: 15
      dma:
        descriptor_queue_depth: 64
        max_outstanding: 16
        channel_count: 2
        setup_overhead_ns: 200
        bandwidth_bytes_sec: 32000000000
      dma_engine_count: 2
      pcie:
        generation: 4
        lane_count: 8
        max_outstanding: 32
        credit_limit: 256
