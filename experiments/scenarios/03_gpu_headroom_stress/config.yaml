## Acceptance Criteria

✅ 3 pods with different GPU utilization (12%, 62%, 87%)  
✅ Both unaware and headroom-aware strategies tested  
✅ Metrics: per-pod requests, OOM count, p99, rejection rate  
✅ Results show load shifting away from high-utilization pod  
✅ Analysis documented  
