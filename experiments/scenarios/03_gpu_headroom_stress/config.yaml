# Experiment 03: GPU Headroom Stress with Skew

## Hypothesis

GPU headroom-aware routing will:
- **Prevent OOM** on memory-constrained pods
- **Balance load** to pods with more headroom
- **Reduce tail latency** from memory pressure

## Configuration

```yaml
experiment:
  name: "gpu_headroom_stress"
  duration_seconds: 300
  warmup_seconds: 30

workload:
  requests_per_second: 150
  prompt_tokens: 2048
  max_tokens: 512

pod_config:
  - id: "pod-1"
    gpu_memory_mb: 80000
    initial_used_mb: 10000  # 12.5% used
  - id: "pod-2"
    gpu_memory_mb: 80000
    initial_used_mb: 50000  # 62.5% used
  - id: "pod-3"
    gpu_memory_mb: 80000
    initial_used_mb: 70000  # 87.5% used (near capacity)

routing_strategies:
  - name: "unaware"
    description: "Routing without GPU headroom awareness"
  - name: "headroom_aware"
    description: "GPU headroom-aware routing"
```

## Expected Results

### GPU-Unaware
```json
{
  "strategy": "unaware",
