  "pod_3_requests": 5000,
  "pod_3_oom_count": 0,
  "p99_latency_ms": 1200,
  "rejection_rate": 0.02
}
```

## Metrics to Collect

- **Requests per pod** - distribution across pods
- **OOM count** - out-of-memory errors per pod
- **p99 latency** - extreme tail latency
- **Rejection rate** - % requests rejected

