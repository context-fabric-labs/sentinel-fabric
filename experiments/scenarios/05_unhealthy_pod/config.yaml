## Grafana Queries

```promql
# Healthy pods
sum(pod_healthy)

# Requests per pod
rate(backend_requests_total{status="success"}[5m]) by (pod_id)

# Error rate
rate(backend_requests_total{status="error"}[5m])

# Health check duration
histogram_quantile(0.95, rate(health_check_duration_ms_bucket[5m]))
```

## Acceptance Criteria

✅ Three phases: healthy, pod failure, recovery  
✅ Pod-2 simulated failure during phase 2  
✅ Metrics: healthy count, requests/pod, error rate, detection/recovery time  
✅ Results show automatic traffic shift away from failed pod  
✅ Error rate remains low despite failure  
✅ Analysis documents failure detection and recovery  
