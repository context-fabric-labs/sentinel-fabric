# Experiment 05: Unhealthy/Failing Pod Behavior

## Hypothesis

Health-aware routing with circuit breaker will:
- **Detect unhealthy pods** quickly
- **Route around failures** automatically
- **Maintain low error rate** despite pod failures

## Configuration

```yaml
experiment:
  name: "unhealthy_pod"
  duration_seconds: 300
  phases:
    - name: "healthy"
      duration_seconds: 60
      all_pods_healthy: true
    - name: "pod_failure"
      duration_seconds: 120
      failed_pods:
        - pod-2
    - name: "recovery"
      duration_seconds: 120
      all_pods_healthy: true

health_check:
  interval_seconds: 5
  timeout_seconds: 3
  unhealthy_threshold: 2

pods:
  - id: "pod-1"
    address: "http://localhost:8001"
  - id: "pod-2"
    address: "http://localhost:8002"
  - id: "pod-3"
    address: "http://localhost:8003"
```

