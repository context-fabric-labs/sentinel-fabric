## Metrics to Collect

### Primary Metrics
- **Healthy pod count** - over time
- **Requests per pod** - distribution
- **Error rate** - during each phase
- **Detection time** - time to detect failure
- **Recovery time** - time to resume routing to recovered pod

### Secondary Metrics
- **Health check duration** - per pod
- **Consecutive failures** - per pod
- **Circuit breaker state** - open/closed/half-open

