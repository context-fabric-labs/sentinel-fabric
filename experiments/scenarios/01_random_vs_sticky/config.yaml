### Expected Improvement
- **~30% lower p50 latency** (KV cache reuse)
- **~27% lower p95 latency** (predictable routing)
- **~25% lower p99 latency** (reduced tail)
- **~3% higher throughput** (less recomputation)
- **~3x KV cache hit rate** (0.33 → 0.95)

