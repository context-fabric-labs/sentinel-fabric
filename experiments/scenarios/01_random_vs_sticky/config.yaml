# Experiment 01: Random Routing vs Sticky Routing

## Hypothesis

Sticky routing (session-aware) will show:
- **Lower latency** for follow-up requests (KV cache reuse)
- **Higher throughput** (less KV recomputation)
- **Better GPU utilization** (predictable load distribution)

## Configuration

```yaml
experiment:
  name: "random_vs_sticky"
  duration_seconds: 300
  warmup_seconds: 30

workload:
  requests_per_second: 100
  session_count: 1000
  requests_per_session: 50
  prompt_tokens: 512
  max_tokens: 256

routing_strategies:
  - name: "random"
    description: "Random pod selection"
  - name: "sticky"
    description: "HRW-based sticky routing"

pods:
  - id: "pod-1"
    address: "http://localhost:8001"
  - id: "pod-2"
    address: "http://localhost:8002"
  - id: "pod-3"
    address: "http://localhost:8003"
```

## Run Script

```bash
#!/bin/bash
set -e

echo "=== Experiment 01: Random vs Sticky Routing ==="

# Start control plane
cd ../../control-plane
cargo run --release &
CONTROL_PLANE_PID=$!
sleep 5

# Run random routing test
echo "Testing random routing..."
python3 ../experiments/scripts/load_generator.py \
  --strategy random \
  --rps 100 \
  --duration 300 \
  --sessions 1000 \
  --output ../experiments/results/01_random_vs_sticky/random.json

# Run sticky routing test
echo "Testing sticky routing..."
python3 ../experiments/scripts/load_generator.py \
  --strategy sticky \
  --rps 100 \
  --duration 300 \
  --sessions 1000 \
  --output ../experiments/results/01_random_vs_sticky/sticky.json

# Stop control plane
kill $CONTROL_PLANE_PID

echo "Experiment complete!"
```

## Metrics to Collect

### Primary Metrics
- **p50 latency** - median request latency
- **p95 latency** - tail latency
- **p99 latency** - extreme tail latency
- **throughput** - requests/second
- **KV cache hit rate** - % requests routed to same pod

### Secondary Metrics
- **GPU memory usage** - per pod
- **KV pressure** - per pod
- **Rejection rate** - % requests rejected
- **Error rate** - % requests failing

