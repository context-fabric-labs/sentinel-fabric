## Grafana Queries

```promql
# KV pressure per pod
pod_kv_pressure_ratio by (pod_id)

# Rejection rate
rate(admission_rejected_total[5m])

# GPU utilization
pod_gpu_memory_used_mb / pod_gpu_memory_total_mb by (pod_id)

# Latency by request type (if tagged)
histogram_quantile(0.95, rate(backend_latency_ms_bucket{type="high_kv"}[5m]))
```

