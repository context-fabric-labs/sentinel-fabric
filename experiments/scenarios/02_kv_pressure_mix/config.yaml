# Experiment 02: Low-KV vs High-KV Workload Mix

## Hypothesis

KV-aware routing will show:
- **Better load balancing** under mixed workloads
- **Lower rejection rate** (avoids overloading pods with high-KV requests)
- **More predictable latency** (prevents KV pressure spikes)

## Configuration

```yaml
experiment:
  name: "kv_pressure_mix"
  duration_seconds: 300
  warmup_seconds: 30

workload:
  requests_per_second: 100
  mix:
    - type: "low_kv"
      ratio: 0.7
      prompt_tokens: 256
      max_tokens: 128
    - type: "high_kv"
      ratio: 0.3
      prompt_tokens: 4096
      max_tokens: 1024

routing_strategies:
  - name: "unaware"
    description: "Routing without KV pressure awareness"
  - name: "kv_aware"
    description: "KV pressure-aware routing (Story 4)"

pods:
  - id: "pod-1"
    address: "http://localhost:8001"
    gpu_memory_mb: 80000
  - id: "pod-2"
    address: "http://localhost:8002"
    gpu_memory_mb: 80000
  - id: "pod-3"
    address: "http://localhost:8003"
    gpu_memory_mb: 80000
```

## Run Script

```bash
#!/bin/bash
set -e

echo "=== Experiment 02: Low-KV vs High-KV Mix ==="

# Start control plane with KV-aware routing
cd ../../control-plane
cargo run --release &
CONTROL_PLANE_PID=$!
sleep 5

# Run KV-unaware test
echo "Testing KV-unaware routing..."
python3 ../experiments/scripts/load_generator.py \
  --config config_kv_unaware.yaml \
  --output ../experiments/results/02_kv_pressure_mix/unaware.json

# Run KV-aware test
echo "Testing KV-aware routing..."
python3 ../experiments/scripts/load_generator.py \
  --config config_kv_aware.yaml \
  --output ../experiments/results/02_kv_pressure_mix/kv_aware.json

# Stop control plane
kill $CONTROL_PLANE_PID

echo "Experiment complete!"
```

## Metrics to Collect

### Primary Metrics
- **Rejection rate** - % requests rejected due to KV pressure
- **p95 latency** - tail latency under mixed load
- **KV pressure variance** - std dev across pods
- **GPU utilization balance** - coefficient of variation

### Secondary Metrics
- **Per-pod KV pressure** - ratio per pod
- **High-KV request latency** - latency for large requests
- **Low-KV request latency** - latency for small requests

## Expected Results

### KV-Unaware Routing
```json
{
  "strategy": "unaware",
  "rejection_rate": 0.15,
  "p95_latency_ms": 1200,
  "kv_pressure_variance": 0.35,
  "gpu_utilization_cv": 0.40,
  "high_kv_p95_ms": 1800,
  "low_kv_p95_ms": 900
}
```

### KV-Aware Routing
```json
{
  "strategy": "kv_aware",
  "rejection_rate": 0.05,
  "p95_latency_ms": 750,
  "kv_pressure_variance": 0.10,
  "gpu_utilization_cv": 0.15,
  "high_kv_p95_ms": 950,
  "low_kv_p95_ms": 650
}
```

### Expected Improvement
- **~67% lower rejection rate** (0.15 → 0.05)
- **~38% lower p95 latency** (1200 → 750ms)
- **~71% lower KV pressure variance** (0.35 → 0.10)
- **~62% lower GPU utilization CV** (0.40 → 0.15)
- **~47% lower high-KV p95** (1800 → 950ms)

