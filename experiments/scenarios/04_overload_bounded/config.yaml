# Experiment 04: Overload Test with Bounded Inflight

## Hypothesis

Bounded inflight admission control will:
- **Prevent cascade failures** under overload
- **Maintain stable latency** for admitted requests
- **Gracefully reject** excess requests

## Configuration

```yaml
experiment:
  name: "overload_bounded"
  duration_seconds: 300
  phases:
    - name: "normal"
      duration_seconds: 60
      requests_per_second: 50
    - name: "overload"
      duration_seconds: 120
      requests_per_second: 300
    - name: "recovery"
      duration_seconds: 120
      requests_per_second: 50

admission_config:
  global_max_inflight: 300
  per_pod_max_inflight: 100
  degradation_threshold: 0.8

pods:
  - id: "pod-1"
    address: "http://localhost:8001"
  - id: "pod-2"
    address: "http://localhost:8002"
  - id: "pod-3"
    address: "http://localhost:8003"
```

## Expected Results

### Without Admission Control
```json
{
  "phase": "overload",
  "admitted_rate": 150,
  "rejected_rate": 150,
  "p50_latency_ms": 2500,
  "p99_latency_ms": 8000,
  "error_rate": 0.25,
  "cascade_failures": true
}
```

### With Admission Control
```json
{
  "phase": "overload",
  "admitted_rate": 300,
  "rejected_rate": 0,
  "p50_latency_ms": 450,
  "p99_latency_ms": 900,
  "error_rate": 0.02,
  "cascade_failures": false
}
```

## Metrics to Collect

### Primary Metrics
- **Admission rate** - requests admitted per second
- **Rejection rate** - requests rejected per second
- **p50/p99 latency** - during each phase
- **Error rate** - % requests failing

### Secondary Metrics
- **Inflight count** - over time
- **Degradation events** - when max_tokens clamped
- **Recovery time** - time to return to normal latency

