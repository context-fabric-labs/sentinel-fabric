## Grafana Queries

```promql
# Admission rate
rate(admission_requests_total[5m])

# Rejection rate
rate(admission_rejected_total[5m])

# Inflight
admission_global_inflight

# Latency by phase
histogram_quantile(0.95, rate(backend_latency_ms_bucket[5m]))
```

## Acceptance Criteria

✅ Three phases: normal (50 RPS), overload (300 RPS), recovery (50 RPS)  
✅ Admission control enabled with bounded inflight  
✅ Metrics: admission rate, rejection rate, latency per phase  
✅ Results show stable latency during overload  
✅ Analysis documents cascade failure prevention  
✅ Graphs show phase transitions  
